# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.BACKEND_TENANT_ID }}
          subscription-id: ${{ secrets.BACKEND_SUBSCRIPTION_ID }}
          
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.13.5"

      - name: Terraform init
        run: >
          terraform init
          -backend-config="subscription_id=${{ secrets.BACKEND_SUBSCRIPTION_ID }}"
          -backend-config="tenant_id=${{ secrets.BACKEND_TENANT_ID }}" 
          -backend-config="resource_group_name=${{ secrets.BACKEND_RESOURCE_GROUP_NAME }}"
          -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=${{ secrets.BACKEND_CONTAINER_NAME }}"
          -backend-config="key=${{ secrets.BACKEND_KEY }}"
    
      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        #if: github.event_name == 'pull_request'
        run: terraform plan -out=tfplan.out

      - name: Upload plan (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan.out

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
